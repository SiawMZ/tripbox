<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tripbox spike: plan map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --paper: #f2f0eb; --ink: #111; --quiet: #6b6863; --rule: #111; --red: #e3000f; --line: #d8d4cc; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--ink); background: var(--paper); display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
  aside { overflow-y: auto; border-right: 2px solid var(--rule); padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--quiet); margin-bottom: 12px; }
  .tabs { display: flex; border-bottom: 2px solid var(--rule); margin-bottom: 8px; }
  .tabs button { flex: 1; background: none; border: 0; padding: 8px; font: 600 14px system-ui; cursor: pointer; color: var(--quiet); }
  .tabs button.on { color: var(--ink); box-shadow: inset 0 -3px 0 var(--red); }
  h2 { font-size: 14px; margin: 20px 0 8px; padding-top: 8px; border-top: 2px solid var(--rule); display: flex; gap: 8px; align-items: center; }
  .swatch { width: 12px; height: 12px; display: inline-block; }
  ol { margin: 0; padding: 0; list-style: none; }
  li { padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 92px 1fr; gap: 8px; }
  li:hover { background: #e8e5de; }
  .time { font-variant-numeric: tabular-nums; color: var(--quiet); }
  .tag { font-size: 11px; color: var(--quiet); }
  .pin { color: var(--red); font-weight: 600; font-size: 11px; }
  .travel { font-size: 11px; color: var(--quiet); }
  .star { color: var(--red); }
  #map { height: 100vh; }
  .num { border-radius: 50%; color: #fff; font: 600 12px/22px system-ui; text-align: center; width: 22px; height: 22px; border: 2px solid #fff; }
  .num.must { border-color: var(--red); box-shadow: 0 0 0 2px #fff; }
  .empty { padding: 24px; }
  .bar { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .bar button, .row button { font: 600 13px system-ui; border: 2px solid var(--ink); background: var(--paper); padding: 6px 10px; cursor: pointer; }
  .bar button.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .count { color: var(--quiet); font-size: 12px; }
  li[draggable] { cursor: grab; }
  li.dragging { opacity: 0.4; }
  section.day { outline: 2px dashed transparent; outline-offset: 2px; }
  section.day.drop-on { outline-color: var(--red); background: #ece9e2; }
  .back { display: inline-block; font-size: 12px; color: var(--quiet); text-decoration: none; margin-bottom: 6px; }
  .back:hover { color: var(--ink); }
  #importer { position: fixed; inset: 0; z-index: 1001; background: rgba(0, 0, 0, 0.35); display: flex; align-items: flex-end; justify-content: center; }
  #importer[hidden], #toast[hidden] { display: none; }
  .imp textarea, .imp input[type=url] { width: 100%; padding: 8px; border: 2px solid var(--ink); background: #fff; font: 14px system-ui; }
  .imp textarea { min-height: 72px; resize: vertical; }
  .imp .pad { padding: 12px 16px; display: grid; gap: 10px; }
  .steps { list-style: none; margin: 0; padding: 8px 16px; }
  .steps li { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: default; }
  .steps li:hover { background: none; }
  .steps .st { width: 22px; height: 22px; border: 2px solid var(--line); border-radius: 50%; display: grid; place-items: center; font-size: 12px; }
  .steps li.done .st { border-color: var(--ink); background: var(--ink); color: #fff; }
  .steps li.now .st { border-color: var(--red); border-top-color: transparent; animation: spin 0.8s linear infinite; }
  .steps li.later { color: var(--quiet); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .source { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .source img, .source .ph { width: 64px; height: 64px; object-fit: cover; background: var(--line); display: block; }
  .rate { display: flex; gap: 8px; align-items: center; padding: 8px 16px; font-size: 13px; color: var(--quiet); border-bottom: 1px solid var(--line); }
  .rate button { border: 1px solid var(--line); background: #fff; padding: 4px 10px; cursor: pointer; font-size: 15px; }
  .rate button.on { border-color: var(--red); }
  .warn { color: var(--red); font-size: 12px; }
  .imp footer { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
  .imp footer .ghost { background: none; color: var(--ink); border: 2px solid var(--ink); }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; z-index: 1002; max-width: 90vw; font-size: 14px; }
  h2 .add { margin-left: auto; font: 600 12px system-ui; border: 2px solid var(--ink); background: var(--paper); padding: 2px 8px; cursor: pointer; }
  #sheet { position: fixed; inset: 0; z-index: 1000; background: rgba(0, 0, 0, 0.35); display: flex; align-items: flex-end; justify-content: center; }
  #sheet[hidden] { display: none; }
  .sheet { background: var(--paper); width: min(560px, 100%); max-height: 80vh; display: flex; flex-direction: column; border-top: 2px solid var(--rule); animation: up 0.2s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet header { padding: 12px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
  .sheet header h3 { margin: 0; font-size: 16px; flex: 1; }
  .sheet .list { overflow-y: auto; padding: 0 16px; }
  .sheet .item { display: grid; grid-template-columns: 56px 1fr 28px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .sheet .item .tick { width: 24px; height: 24px; border: 2px solid var(--ink); display: grid; place-items: center; font-size: 14px; }
  .sheet .item.on .tick { background: var(--red); border-color: var(--red); color: #fff; }
  .sheet footer { padding: 12px 16px; border-top: 1px solid var(--line); }
  .sheet footer button { width: 100%; padding: 12px; font: 600 15px system-ui; background: var(--red); color: #fff; border: 0; cursor: pointer; }
  .sheet footer button:disabled { background: var(--line); color: var(--quiet); cursor: default; }
  .sheet .search { padding: 8px 16px; }
  .when { display: inline-flex; gap: 4px; margin-top: 4px; }
  .when select, .when input { font: 12px system-ui; padding: 2px 4px; border: 1px solid var(--quiet); background: #fff; }
  .thumb { width: 56px; height: 56px; object-fit: cover; display: block; background: var(--line); }
  .thumb.small { width: 40px; height: 40px; }
  li.stop { grid-template-columns: 82px 40px 1fr 28px; align-items: center; }
  li.stop .remove { width: 28px; height: 28px; border: 1px solid var(--line); background: none; cursor: pointer; color: var(--quiet); font-size: 13px; }
  li.stop .remove:hover { border-color: var(--red); color: var(--red); }
  .row { display: grid; grid-template-columns: 32px 56px 1fr 32px; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .row.off { opacity: 0.4; }
  .row button { width: 32px; height: 32px; padding: 0; border-width: 1px; font-size: 16px; line-height: 1; }
  .row button.starred { background: var(--red); border-color: var(--red); color: #fff; }
  .row .name { cursor: pointer; }
  .leg { font-size: 11px; color: var(--quiet); padding: 4px 0 4px 100px; border-bottom: 1px solid var(--line); }
  .leg a, .travel a { color: var(--ink); }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0; }
  .form label { display: grid; gap: 4px; font-size: 12px; color: var(--quiet); }
  .form input, .form select { padding: 6px; border: 2px solid var(--ink); background: #fff; font: 14px system-ui; width: 100%; }
  .pick { padding: 8px; border: 1px solid var(--line); margin: 4px 0; cursor: pointer; font-size: 13px; }
  .pick:hover { background: #e8e5de; }
  #startq { flex: 1; }
  input[type=search] { width: 100%; padding: 8px; border: 2px solid var(--ink); background: #fff; font: 14px system-ui; }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; grid-template-rows: 45vh 55vh; } aside { order: 2; border-right: 0; border-top: 2px solid var(--rule); } #map { height: 45vh; } }
</style>
</head>
<body>
<aside id="side"></aside>
<div id="map"></div>
<div id="sheet" hidden></div>
<div id="importer" hidden></div>
<div id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
  // Places tab: star must-gos (★) or remove places (✕), then Plan runs the same planner in the browser.
  // The trip comes from the local server (`deno task serve`); the planner runs here in the browser and
  // loads fresh every time (browsers cache it, and a stale planner.js once kept running old code).
  const COLORS = ['#e3000f', '#1f5fbf', '#2f8a3b', '#b8860b', '#7a3fb0', '#0f8f8f', '#c2541a'];
  const side = document.getElementById('side');
  const params = new URLSearchParams(location.search);
  const tripId = params.get('trip');
  if (!tripId) location.replace('./');
  const { planTrip } = await import(`./out/planner.js?v=${Date.now()}`);
  const api = async (path, init) => {
    const res = await fetch(`/api/trips/${encodeURIComponent(tripId)}${path}`, init);
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || `Request failed (${res.status})`);
    return out;
  };
  let TRIP;
  let tripName;
  try {
    const payload = await api('');
    TRIP = payload.input;
    tripName = payload.trip.name;
  } catch (e) {
    side.innerHTML = `<div class="empty"><h1>Couldn’t open this trip</h1><p>${String(e.message).replace(/</g, '&lt;')}</p><p>Is the local server running (<code>deno task serve</code>)? <a href="./">All trips</a></p></div>`;
    throw e;
  }
  let plan = { days: [], maybe: [] };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const label = (p) => (p.nameLocal && p.nameLocal !== p.name ? `${esc(p.name)} <span class="tag">${esc(p.nameLocal)}</span>` : esc(p.name));

  // Stars, chosen days and removals are kept in this browser, per trip. Trip settings live on the
  // server (trip.json), so the home page shows the same dates.
  const storeKey = `tripbox:trip:${tripId}`;
  const saved = (() => { try { return JSON.parse(localStorage.getItem(storeKey) || 'null'); } catch { return null; } })();
  const state = saved?.choices ?? Object.fromEntries(TRIP.places.map((p) => [p.key, p.must ? 'must' : 'want']));
  const settings = {
    startDate: TRIP.startDate,
    days: TRIP.days,
    dayStart: TRIP.dayStart,
    dayEnd: TRIP.dayEnd,
    travelMode: TRIP.travelMode,
    maxMealsPerDay: TRIP.maxMealsPerDay ?? 3,
    maxPlacesPerDay: TRIP.maxPlacesPerDay ?? '',
    hotel: TRIP.hotel,
  };
  // A place can be put on a trip day, with or without a time. With a time it is a fixed slot (a booking).
  const dayChoice = saved?.dayChoice ?? Object.fromEntries([
    ...TRIP.places.filter((p) => p.day).map((p) => [p.key, { day: p.day, time: '' }]),
    ...TRIP.pins.map((p) => [p.key, { day: p.day, time: p.time }]),
  ]);
  // Small edits (drag, add, remove) keep every other stop on the day it is on now, so the trip doesn't
  // reshuffle under the user. "Optimize route" clears these locks and plans everything again.
  // Kept for this visit only: after a reload (or a planner change) the trip is planned fresh, while
  // the user's own choices (stars, chosen days, removals) are kept.
  let locks = {};
  const lockCurrentDays = () => {
    locks = {};
    for (const d of plan.days) for (const s of d.stops) if (!s.pinned) locks[s.key] = d.day;
  };
  const save = () => { try { localStorage.setItem(storeKey, JSON.stringify({ choices: state, dayChoice })); } catch {} };
  const saveSettings = () => {
    api('', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ...settings,
        days: Number(settings.days) || 1,
        maxMealsPerDay: Number(settings.maxMealsPerDay) || 3,
        maxPlacesPerDay: Number(settings.maxPlacesPerDay) || undefined,
      }),
    }).catch((e) => toast(`Couldn’t save the trip settings: ${e.message}`));
  };
  // Places added since this browser last saw the trip start as "maybe" (not starred).
  const ensureState = () => { for (const p of TRIP.places) state[p.key] ??= p.must ? 'must' : 'want'; };
  ensureState();
  const WEEKDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const dateOf = (day) => { const d = new Date(`${settings.startDate}T00:00:00Z`); d.setUTCDate(d.getUTCDate() + day - 1); return d; };
  const closedOn = (p, day) => {
    const wd = dateOf(day).getUTCDay();
    return !!p.periods?.length && !p.periods.some((x) => !x.close || x.open.day === wd);
  };

  const map = L.map('map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
  const layer = L.layerGroup().addTo(map);
  let markers = [];
  let tab = 'plan';
  let query = '';
  let pickingStart = false;
  let startResults = [];

  function replan() {
    const days = Math.max(1, Math.min(14, Number(settings.days) || 1));
    const chosen = (k) => (dayChoice[k] && dayChoice[k].day <= days ? dayChoice[k] : null);
    const places = TRIP.places
      .filter((p) => state[p.key] !== 'skip')
      .map((p) => ({ ...p, must: state[p.key] === 'must', day: chosen(p.key) && !chosen(p.key).time ? chosen(p.key).day : locks[p.key] <= days ? locks[p.key] : undefined }));
    const pins = places.flatMap((p) => (chosen(p.key)?.time ? [{ key: p.key, day: chosen(p.key).day, time: chosen(p.key).time }] : []));
    plan = {
      ...planTrip({
        ...TRIP,
        startDate: settings.startDate,
        days,
        dayStart: settings.dayStart,
        dayEnd: settings.dayEnd,
        travelMode: settings.travelMode,
        maxMealsPerDay: Number(settings.maxMealsPerDay) || 3,
        maxPlacesPerDay: Number(settings.maxPlacesPerDay) || undefined,
        hotel: settings.hotel,
        pins,
        places,
      }),
    };
    tab = 'plan';
    render(true);
  }

  // Google Maps photo downloaded by `deno task photos`; Google asks for the photographer's name to be shown.
  const thumb = (p, size = '') =>
    p.photo
      ? `<img class="thumb ${size}" src="${esc(p.photo)}" alt="" loading="lazy" title="${esc(p.photoCredit ? `Photo: ${p.photoCredit} / Google Maps` : 'Photo: Google Maps')}">`
      : `<span class="thumb ${size} none"></span>`;

  // Getting from one stop to the next: walk for short hops, else the trip's mode, with a Google Maps link.
  const MODE = { walk: ['Walk', 'walking'], transit: ['MRT or bus', 'transit'], car: ['Taxi or car', 'driving'] };
  function leg(from, to, l) {
    if (!l) return '';
    if (l.travelKm < 0.1) return `<div class="leg">↓ Same building or next door</div>`;
    const [word, gm] = MODE[l.travelMode] ?? MODE.transit;
    const url = `https://www.google.com/maps/dir/?api=1&origin=${from.lat},${from.lng}&destination=${to.lat},${to.lng}&travelmode=${gm}`;
    return `<div class="leg">↓ ${word} · about ${l.travelMin} min · ${l.travelKm} km · <a href="${url}" target="_blank" rel="noopener">Directions</a></div>`;
  }

  function drawMap(fit) {
    layer.clearLayers();
    markers = [];
    const hotel = settings.hotel;
    const bounds = [[hotel.lat, hotel.lng]];
    L.marker([hotel.lat, hotel.lng], { title: hotel.name }).addTo(layer).bindPopup(`<b>${esc(hotel.name)}</b><br>Hotel`);
    plan.days.forEach((d, di) => {
      const color = COLORS[di % COLORS.length];
      const path = [[hotel.lat, hotel.lng]];
      d.stops.forEach((s, si) => {
        path.push([s.lat, s.lng]);
        bounds.push([s.lat, s.lng]);
        const icon = L.divIcon({ className: '', html: `<div class="num${s.must ? ' must' : ''}" style="background:${color}">${si + 1}</div>`, iconSize: [22, 22] });
        const link = s.mapsUrl ? `<br><a href="${esc(s.mapsUrl)}" target="_blank" rel="noopener">Open in Google Maps</a>` : '';
        markers.push(L.marker([s.lat, s.lng], { icon }).addTo(layer).bindPopup(`<b>${s.must ? '★ ' : ''}${label(s)}</b><br>Day ${d.day}, ${esc(s.start)}–${esc(s.leave)}${link}`));
      });
      path.push([hotel.lat, hotel.lng]);
      L.polyline(path, { color, weight: 3, opacity: 0.8 }).addTo(layer);
    });
    for (const m of plan.maybe) {
      markers.push(L.circleMarker([m.lat, m.lng], { radius: 5, color: '#6b6863', weight: 1, fillOpacity: 0.25 }).addTo(layer).bindPopup(`<b>${label(m)}</b><br>${esc(m.reason)}`));
    }
    if (fit) {
      map.invalidateSize();
      // A new trip has only its start point: show the city around it instead of zooming all the way in.
      if (bounds.length === 1) map.setView(bounds[0], 13);
      else map.fitBounds(bounds, { padding: [30, 30] });
    }
  }

  // ---------- Add sheet: pick saved places for a day (or any day), then re-optimize at once ----------
  const sheetEl = document.getElementById('sheet');
  let sheet = null; // { day: number | null, picked: Set, q: string }

  function openSheet(day) {
    sheet = { day, picked: new Set(), q: '' };
    drawSheet();
  }

  function drawSheet() {
    if (!sheet) { sheetEl.hidden = true; sheetEl.innerHTML = ''; return; }
    const inPlan = new Set(plan.days.flatMap((d) => d.stops.map((s) => s.key)));
    const why = new Map(plan.maybe.map((m) => [m.key, m.reason]));
    const q = sheet.q.toLowerCase();
    const list = TRIP.places
      .filter((p) => !inPlan.has(p.key))
      .filter((p) => !q || [p.name, p.nameLocal, p.type, p.area].some((v) => v?.toLowerCase().includes(q)));
    const title = sheet.day ? `Add to Day ${sheet.day}` : 'Add to the trip';
    let html = `<div class="sheet" role="dialog" aria-label="${title}">
      <header><h3>${title}</h3><button data-sheet="close" class="add" aria-label="Close">✕</button></header>
      <div class="search"><input type="search" id="sheetq" placeholder="Search your saved places (${list.length})" value="${esc(sheet.q)}"></div>
      <div class="list">`;
    for (const p of list) {
      const on = sheet.picked.has(p.key);
      const note = state[p.key] === 'skip' ? 'Removed earlier' : why.get(p.key) ?? '';
      html += `<div class="item${on ? ' on' : ''}" data-sheetpick="${esc(p.key)}">${thumb(p)}<span>${label(p)}<br><span class="tag">${esc(p.type)}${p.area ? ` · ${esc(p.area)}` : ''}</span>${note ? `<br><span class="travel">${esc(note)}</span>` : ''}</span><span class="tick">${on ? '✓' : ''}</span></div>`;
    }
    if (!list.length) html += `<p class="travel">Every saved place is already in the plan.</p>`;
    const n = sheet.picked.size;
    html += `</div><footer><button data-sheet="add"${n ? '' : ' disabled'}>${n ? `Add ${n} place${n > 1 ? 's' : ''} and re-plan` : 'Pick places to add'}</button></footer></div>`;
    sheetEl.innerHTML = html;
    sheetEl.hidden = false;
    const input = sheetEl.querySelector('#sheetq');
    input.addEventListener('input', (e) => {
      sheet.q = e.target.value;
      const pos = e.target.selectionStart;
      drawSheet();
      const again = sheetEl.querySelector('#sheetq');
      again.focus();
      again.setSelectionRange(pos, pos);
    });
  }

  sheetEl.addEventListener('click', (e) => {
    if (e.target === sheetEl) { sheet = null; drawSheet(); return; } // tap outside closes
    const pick = e.target.closest('[data-sheetpick]');
    if (pick) {
      const k = pick.dataset.sheetpick;
      sheet.picked.has(k) ? sheet.picked.delete(k) : sheet.picked.add(k);
      drawSheet();
      return;
    }
    const act = e.target.closest('[data-sheet]')?.dataset.sheet;
    if (act === 'close') { sheet = null; drawSheet(); return; }
    if (act === 'add') {
      // Added places become must-gos; from a day's button they also stay on that day.
      lockCurrentDays();
      for (const k of sheet.picked) {
        state[k] = 'must';
        if (sheet.day) dayChoice[k] = { day: sheet.day, time: '' };
      }
      sheet = null;
      drawSheet();
      save();
      replan();
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheet) { sheet = null; drawSheet(); } });

  // ---------- Drag a stop (or a Maybe place) onto another day ----------
  // The drop sets the day; the order inside the day is re-optimized. A booked time moves with the place.
  function moveToDay(key, day) {
    lockCurrentDays();
    delete locks[key];
    const was = dayChoice[key];
    dayChoice[key] = { day, time: was?.time ?? '' };
    state[key] = 'must';
    save();
    replan();
  }
  side.addEventListener('dragstart', (e) => {
    const li = e.target.closest('li[data-key]');
    if (!li) return;
    e.dataTransfer.setData('text/plain', li.dataset.key);
    e.dataTransfer.effectAllowed = 'move';
    li.classList.add('dragging');
  });
  side.addEventListener('dragend', (e) => e.target.closest?.('li')?.classList.remove('dragging'));
  side.addEventListener('dragover', (e) => {
    const sec = e.target.closest('section[data-dropday]');
    if (!sec) return;
    e.preventDefault();
    side.querySelectorAll('.drop-on').forEach((x) => x !== sec && x.classList.remove('drop-on'));
    sec.classList.add('drop-on');
  });
  side.addEventListener('dragleave', (e) => {
    const sec = e.target.closest('section[data-dropday]');
    if (sec && !sec.contains(e.relatedTarget)) sec.classList.remove('drop-on');
  });
  side.addEventListener('drop', (e) => {
    const sec = e.target.closest('section[data-dropday]');
    if (!sec) return;
    e.preventDefault();
    sec.classList.remove('drop-on');
    const key = e.dataTransfer.getData('text/plain');
    const day = Number(sec.dataset.dropday);
    const from = plan.days.find((d) => d.stops.some((s) => s.key === key));
    if (key && (!from || from.day !== day)) moveToDay(key, day);
  });

  // ---------- Import a link: paste -> progress -> review the places found -> add to this trip ----------
  const impEl = document.getElementById('importer');
  const toastEl = document.getElementById('toast');
  const STEPS = [
    ['open', 'Opening the post'],
    ['read', 'Reading its text and pictures'],
    ['find', 'Finding places'],
    ['details', 'Checking each place on the map'],
    ['done', 'Your places are ready'],
  ];
  const preview = L.layerGroup().addTo(map);
  let imp = null;
  let toastTimer;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (toastEl.hidden = true), 6000);
  }

  function openImport() {
    imp = { phase: 'input', url: '', text: '', at: null, detail: '', picked: new Set(), rated: null };
    drawImport();
    impEl.querySelector('#impurl')?.focus();
  }
  function closeImport() {
    imp = null;
    preview.clearLayers();
    drawImport();
  }

  function drawImport() {
    if (!imp) { impEl.hidden = true; impEl.innerHTML = ''; return; }
    let body = '';
    if (imp.phase === 'input' || imp.phase === 'error') {
      body = `<div class="pad">
        <label class="travel">Link to a post or page<input type="url" id="impurl" placeholder="https://www.xiaohongshu.com/… or Instagram, YouTube, a blog…" value="${esc(imp.url)}"></label>
        <label class="travel">Place names or post text (optional: for videos, or posts that won't open)<textarea id="imptext" placeholder="e.g. 鼎泰豐 信義店, 永康街 思慕昔">${esc(imp.text)}</textarea></label>
        ${imp.phase === 'error' ? `<p class="warn">${esc(imp.error)}</p>` : ''}
      </div>
      <footer><button data-imp="close" class="ghost">Cancel</button><button data-imp="go">Find places</button></footer>`;
    } else if (imp.phase === 'working') {
      const at = STEPS.findIndex(([k]) => k === imp.at);
      body = `<ol class="steps">${STEPS.map(([, text], i) => {
        const cls = i < at ? 'done' : i === at ? 'now' : 'later';
        return `<li class="${cls}"><span class="st">${i < at ? '✓' : ''}</span><span>${text}</span><span class="travel">${i === at ? esc(imp.detail) : ''}</span></li>`;
      }).join('')}</ol><p class="travel" style="padding:0 16px 12px">Most posts take 5–15 seconds; posts with many pictures take longer.</p>`;
    } else {
      const r = imp.result;
      const src = r.source;
      body = `<div class="source">${src.image ? `<img src="${esc(src.image)}" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=ph></span>'">` : '<span class="ph"></span>'}
          <div><b>${esc(src.title || src.url || 'Pasted text')}</b><br><span class="tag">${esc(src.platform)}${src.author ? ` · ${esc(src.author)}` : ''}${src.readImages ? ' · read the pictures too' : ''}</span></div></div>
        <div class="rate">How was this import? <button data-rate="good" class="${imp.rated === 'good' ? 'on' : ''}" title="Good">👍</button><button data-rate="bad" class="${imp.rated === 'bad' ? 'on' : ''}" title="Wrong or missing places">👎</button>${imp.rated ? ' Thanks!' : ''}</div>
        <div class="list">`;
      if (!r.places.length) {
        body += `<p class="travel" style="padding:12px 0">No places found in this post. If they're only in the video or pictures, go back and type the place names in the box.</p>`;
      }
      r.places.forEach((p, i) => {
        const on = imp.picked.has(i);
        const note = !p.matched ? 'Not found on the map'
          : p.already ? 'Already in this trip'
          : p.kmAway > r.maxKm ? `${p.kmAway.toLocaleString()} km from your start: probably another place with the same name`
          : p.confidence === 'low' ? 'Unsure: check this is the right place' : '';
        body += `<div class="item${on ? ' on' : ''}" data-imppick="${i}">${p.photo ? `<img class="thumb" src="${esc(p.photo)}" alt="">` : '<span class="thumb none"></span>'}
          <span>${esc(p.name)}${p.nameLocal && p.nameLocal !== p.name ? ` <span class="tag">${esc(p.nameLocal)}</span>` : ''}<br><span class="tag">${esc(p.type)}${p.address ? ` · ${esc(p.address)}` : ''}</span>${note ? `<br><span class="${p.matched && !p.already ? 'warn' : 'travel'}">${esc(note)}</span>` : ''}</span>
          <span class="tick">${on ? '✓' : ''}</span></div>`;
      });
      const n = imp.picked.size;
      const all = r.places.length && n === r.places.filter((p) => p.matched).length;
      body += `</div><footer>${r.places.length ? `<button data-imp="${all ? 'none' : 'all'}" class="ghost">${all ? 'Deselect all' : 'Select all'}</button>` : `<button data-imp="back" class="ghost">Back</button>`}
        <button data-imp="add"${n ? '' : ' disabled'}>${n ? `Add ${n} place${n > 1 ? 's' : ''} to this trip` : 'Pick places to add'}</button></footer>`;
    }
    const title = imp.phase === 'review' ? `Found ${imp.result.places.length} place${imp.result.places.length === 1 ? '' : 's'}` : 'Import a link';
    impEl.innerHTML = `<div class="sheet imp" role="dialog" aria-label="${title}"><header><h3>${title}</h3><button data-imp="close" class="add" aria-label="Close">✕</button></header>${body}</div>`;
    impEl.hidden = false;
  }

  async function runImport() {
    imp.url = impEl.querySelector('#impurl').value.trim();
    imp.text = impEl.querySelector('#imptext').value.trim();
    if (!imp.url && !imp.text) { imp.phase = 'error'; imp.error = 'Paste a link, or type the place names.'; drawImport(); return; }
    imp.phase = 'working';
    imp.at = 'open';
    imp.detail = '';
    drawImport();
    try {
      const res = await fetch(`/api/trips/${encodeURIComponent(tripId)}/import`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: imp.url, text: imp.text }),
      });
      // One JSON line per step, so the checklist moves while the server works.
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          if (line && imp) onImportEvent(JSON.parse(line));
        }
      }
    } catch (e) {
      if (imp) { imp.phase = 'error'; imp.error = `Couldn't reach the local server: ${e.message}`; drawImport(); }
    }
  }

  function onImportEvent(ev) {
    if (ev.step === 'error') {
      imp.phase = 'error';
      imp.error = ev.message;
    } else if (ev.step === 'done') {
      imp.phase = 'review';
      imp.result = ev;
      // Ticked by default: found on the map, new to this trip, and near the start point.
      imp.picked = new Set(ev.places.map((p, i) => (p.matched && !p.already && p.kmAway <= ev.maxKm ? i : -1)).filter((i) => i >= 0));
      showPreview();
    } else {
      imp.at = ev.step === 'find' && ev.count ? 'details' : ev.step;
      imp.detail = ev.step === 'find' ? `${ev.count} found` : ev.step === 'details' ? `${ev.done} of ${ev.total}` : '';
    }
    drawImport();
  }

  // The places found, as purple dots on the map while the user reviews them.
  function showPreview() {
    preview.clearLayers();
    const near = imp.result.places.filter((p) => p.lat != null && p.kmAway <= imp.result.maxKm);
    for (const [i, p] of imp.result.places.entries()) {
      if (p.lat == null) continue;
      L.circleMarker([p.lat, p.lng], { radius: 9, color: '#7a3fb0', weight: 2, fillOpacity: 0.5 })
        .addTo(preview).bindTooltip(`${i + 1}. ${p.name}`);
    }
    if (near.length) map.fitBounds(near.map((p) => [p.lat, p.lng]), { padding: [60, 60], maxZoom: 15 });
  }

  async function addImported() {
    const picks = [...imp.picked];
    const btn = impEl.querySelector('[data-imp=add]');
    btn.disabled = true;
    btn.textContent = 'Adding…';
    try {
      const out = await api('/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ importId: imp.result.importId, picks }),
      });
      TRIP = out.input;
      ensureState();
      // Keep the current days as they are; new places join where they're on the way.
      if (plan.days.some((d) => d.stops.length)) lockCurrentDays();
      closeImport();
      replan();
      const added = new Set(out.added);
      const inPlan = plan.days.flatMap((d) => d.stops).filter((s) => added.has(s.key)).length;
      toast(`Added ${added.size} place${added.size === 1 ? '' : 's'}: ${inPlan} in the plan${added.size - inPlan ? `, ${added.size - inPlan} in Maybe (star or drag the ones you want)` : ''}.`);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Try again';
      toast(e.message);
    }
  }

  impEl.addEventListener('click', (e) => {
    if (e.target === impEl && imp?.phase !== 'working') { closeImport(); return; }
    const pick = e.target.closest('[data-imppick]');
    if (pick) {
      const i = Number(pick.dataset.imppick);
      if (!imp.result.places[i].matched) return;
      imp.picked.has(i) ? imp.picked.delete(i) : imp.picked.add(i);
      drawImport();
      return;
    }
    const rate = e.target.closest('[data-rate]')?.dataset.rate;
    if (rate) {
      imp.rated = rate;
      api('/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ importId: imp.result.importId, rating: rate }) }).catch(() => {});
      drawImport();
      return;
    }
    const act = e.target.closest('[data-imp]')?.dataset.imp;
    if (act === 'close') closeImport();
    if (act === 'go') runImport();
    if (act === 'back') { imp.phase = 'input'; drawImport(); }
    if (act === 'all') { imp.picked = new Set(imp.result.places.map((p, i) => (p.matched ? i : -1)).filter((i) => i >= 0)); drawImport(); }
    if (act === 'none') { imp.picked = new Set(); drawImport(); }
    if (act === 'add') addImported();
  });
  impEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.id === 'impurl') runImport();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && imp && imp.phase !== 'working') closeImport(); });

  function planHtml() {
    if (!TRIP.places.length) {
      return `<div class="empty"><p><b>No places yet.</b></p><p class="travel">Import links to posts you saved on Xiaohongshu, Instagram, YouTube, TikTok or travel blogs. The places in them become this trip's plan.</p><div class="bar"><button class="primary" data-act="import">+ Import a link</button></div></div>`;
    }
    let html = `<div class="bar"><button class="primary" data-act="import">+ Import link</button><button data-addday="0">+ Add saved places</button><button data-act="plan">Optimize all days</button></div><p class="travel">Drag a stop to another day · ✕ removes it. Other stops stay on their day until you press Optimize.</p>`;
    let n = 0;
    plan.days.forEach((d, di) => {
      const color = COLORS[di % COLORS.length];
      html += `<section class="day" data-dropday="${d.day}"><h2><span class="swatch" style="background:${color}"></span>Day ${d.day} · ${esc(d.weekday)} ${esc(d.date)}<button class="add" data-addday="${d.day}">+ Add</button></h2><ol>`;
      const hotel = settings.hotel;
      html += `<div class="travel">Start: ${esc(hotel.name)}</div>`;
      d.stops.forEach((s, si) => {
        html += leg(si ? d.stops[si - 1] : hotel, s, s);
        html += `<li class="stop" draggable="true" data-key="${esc(s.key)}" data-m="${n++}"><span class="time">${esc(s.start)}–${esc(s.leave)}</span>${thumb(s, 'small')}<span>${si + 1}. ${s.must ? '<span class="star">★</span> ' : ''}${label(s)} <span class="tag">${esc(s.type)}</span>${s.pinned ? ' <span class="pin">PINNED</span>' : ''}${s.late ? ' <span class="pin">LATE</span>' : ''}${s.waitMin ? `<br><span class="travel">${s.waitMin} min free before</span>` : ''}</span><button class="remove" data-remove="${esc(s.key)}" title="Remove from this trip">✕</button></li>`;
      });
      if (!d.stops.length) html += `<li><span class="time">—</span><span class="travel">Nothing planned</span></li>`;
      if (d.stops.length) html += leg(d.stops.at(-1), hotel, d.back);
      html += `</ol><div class="travel">Back at ${esc(hotel.name)} about ${esc(d.endBack)}</div></section>`;
    });
    if (plan.maybe.length) {
      html += `<h2>Maybe (${plan.maybe.length})</h2><p class="travel">Drag one onto a day to fit it in.</p><ol>`;
      for (const m of plan.maybe) html += `<li draggable="true" data-key="${esc(m.key)}" data-m="${n++}"><span class="time">${m.must ? '<span class="star">★</span>' : '—'}</span><span>${label(m)}<br><span class="travel">${esc(m.reason)}</span></span></li>`;
      html += `</ol>`;
    }
    return html;
  }

  function placesHtml() {
    const counts = { must: 0, want: 0, skip: 0 };
    for (const p of TRIP.places) counts[state[p.key]]++;
    const q = query.toLowerCase();
    const rank = { must: 0, want: 1, skip: 2 };
    const list = TRIP.places
      .filter((p) => !q || [p.name, p.nameLocal, p.type, p.area].some((v) => v?.toLowerCase().includes(q)))
      .sort((a, b) => rank[state[a.key]] - rank[state[b.key]] || a.type.localeCompare(b.type) || a.name.localeCompare(b.name));
    let html = `<div class="bar"><button class="primary" data-act="import">+ Import link</button><button data-act="plan">Optimize route</button><span class="count">${counts.must} must-go · ${counts.want} maybe · ${counts.skip} removed</span></div>`;
    html += `<p class="travel">★ = must go: planned first. Other places are added only when they're on the way. ✕ = not this trip.</p>`;
    html += `<input type="search" placeholder="Search places" value="${esc(query)}">`;
    for (const p of list) {
      const st = state[p.key];
      const c = dayChoice[p.key];
      const nDays = Number(settings.days) || 1;
      const dayOpts = [`<option value="">Any day</option>`, ...Array.from({ length: nDays }, (_, i) => {
        const d = dateOf(i + 1);
        return `<option value="${i + 1}"${c?.day === i + 1 ? ' selected' : ''}>Day ${i + 1} · ${WEEKDAY[d.getUTCDay()]}</option>`;
      })].join('');
      const closedWarn = c?.day && closedOn(p, c.day) ? ' <span class="pin">Closed that day</span>' : '';
      const pin = `<span class="when"><select data-day="${esc(p.key)}">${dayOpts}</select>${c?.day ? `<input type="time" data-time="${esc(p.key)}" value="${esc(c.time || '')}" title="Optional: a fixed time, e.g. a booking">` : ''}</span>${closedWarn}`;
      html += `<div class="row${st === 'skip' ? ' off' : ''}" data-key="${esc(p.key)}">
        <button class="${st === 'must' ? 'starred' : ''}" data-act="star" title="Must go">★</button>
        ${thumb(p)}
        <span class="name">${label(p)}<br><span class="tag">${esc(p.type)}${p.area ? ` · ${esc(p.area)}` : ''}</span><br>${pin}</span>
        <button data-act="skip" title="${st === 'skip' ? 'Add back' : 'Not this trip'}">${st === 'skip' ? '+' : '✕'}</button>
      </div>`;
    }
    return html;
  }

  function tripHtml() {
    const opt = (v, cur, text) => `<option value="${v}"${String(v) === String(cur) ? ' selected' : ''}>${text}</option>`;
    let html = `<div class="form">
      <label>Start date<input type="date" data-set="startDate" value="${esc(settings.startDate)}"></label>
      <label>Days<input type="number" min="1" max="14" data-set="days" value="${esc(settings.days)}"></label>
      <label>Day starts<input type="time" data-set="dayStart" value="${esc(settings.dayStart)}"></label>
      <label>Day ends<input type="time" data-set="dayEnd" value="${esc(settings.dayEnd)}"></label>
      <label>Meals a day<select data-set="maxMealsPerDay">${[1, 2, 3, 4, 5].map((n) => opt(n, settings.maxMealsPerDay, n)).join('')}</select></label>
      <label>Places a day<select data-set="maxPlacesPerDay">${opt('', settings.maxPlacesPerDay, 'As many as fit')}${[3, 4, 5, 6, 7, 8].map((n) => opt(n, settings.maxPlacesPerDay, n)).join('')}</select></label>
      <label>Getting around<select data-set="travelMode">${opt('transit', settings.travelMode, 'MRT and bus')}${opt('car', settings.travelMode, 'Taxi or car')}${opt('walk', settings.travelMode, 'Walking only')}</select></label>
    </div>`;
    html += `<h2>Start and end each day at</h2>
      <p><b>${esc(settings.hotel.name)}</b><br><span class="tag">${settings.hotel.lat.toFixed(5)}, ${settings.hotel.lng.toFixed(5)}</span></p>
      <div class="bar"><input type="search" id="startq" placeholder="Search a hotel or address"><button data-act="findstart">Search</button></div>`;
    for (const [i, r] of startResults.entries()) html += `<div class="pick" data-pick="${i}">${esc(r.display_name)}</div>`;
    html += `<div class="bar"><button data-act="pickmap" class="${pickingStart ? 'primary' : ''}">${pickingStart ? 'Now click the map…' : 'Or click the map'}</button></div>`;
    html += `<div class="bar"><button class="primary" data-act="plan">Optimize route</button></div>`;
    html += `<h2>Start over</h2><p class="travel">Clears your stars, chosen days and removed places in this browser. The trip's places and settings stay.</p><div class="bar"><button data-act="reset">Reset this trip</button></div>`;
    return html;
  }

  function render(fit = false) {
    const head = `<a class="back" href="./">← All trips</a><h1>${esc(tripName || TRIP.city || 'Trip')}</h1><div class="sub">${plan.days.length} days from ${esc(settings.startDate)} · ${esc(MODE[settings.travelMode]?.[0] ?? settings.travelMode)} · from ${esc(settings.hotel.name)}</div>`;
    const tabs = `<div class="tabs">${[['plan', 'Plan'], ['places', `Places (${TRIP.places.length})`], ['trip', 'Trip']].map(([k, t]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${t}</button>`).join('')}</div>`;
    side.innerHTML = head + tabs + (tab === 'plan' ? planHtml() : tab === 'places' ? placesHtml() : tripHtml());
    drawMap(fit);
    const search = side.querySelector('input[type=search]:not(#startq)');
    if (search) search.addEventListener('input', (e) => { query = e.target.value; const pos = e.target.selectionStart; render(); const s = side.querySelector('input[type=search]'); s.focus(); s.setSelectionRange(pos, pos); });
    const startq = side.querySelector('#startq');
    if (startq) startq.addEventListener('keydown', (e) => { if (e.key === 'Enter') findStart(startq.value); });
  }

  side.addEventListener('change', (e) => {
    // Choosing a day makes the place a must-go; "Any day" removes the day and its time.
    const dk = e.target.dataset?.day;
    if (dk !== undefined) {
      const day = Number(e.target.value);
      if (day) {
        dayChoice[dk] = { day, time: dayChoice[dk]?.time ?? '' };
        state[dk] = 'must';
      } else delete dayChoice[dk];
      save();
      render();
      return;
    }
    const tk = e.target.dataset?.time;
    if (tk !== undefined) {
      if (dayChoice[tk]) dayChoice[tk].time = e.target.value;
      save();
      return;
    }
    const key = e.target.dataset?.set;
    if (!key) return;
    settings[key] = e.target.value;
    saveSettings();
  });

  // Address search with OpenStreetMap's free geocoder (no key); fine for a test, not for the real app.
  async function findStart(q) {
    if (!q.trim()) return;
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(q)}`);
      startResults = await res.json();
    } catch { startResults = []; }
    if (!startResults.length) startResults = [{ display_name: 'Nothing found. Try another name, or click the map.', none: true }];
    render();
  }

  function setStart(name, lat, lng) {
    settings.hotel = { name, lat: Number(lat), lng: Number(lng) };
    startResults = [];
    pickingStart = false;
    saveSettings();
    render();
  }

  map.on('click', (e) => {
    if (!pickingStart) return;
    setStart('Pinned start point', e.latlng.lat, e.latlng.lng);
  });

  side.addEventListener('click', (e) => {
    if (e.target.closest('select,input')) return; // the day and time pickers handle themselves
    const t = e.target.closest('[data-addday],[data-remove],[data-tab],[data-act],[data-pick],li[data-m],.name');
    if (!t) return;
    if (t.dataset.addday !== undefined) { openSheet(Number(t.dataset.addday) || null); return; }
    // ✕ on a stop: take it off this trip and re-plan; the Places tab can add it back.
    if (t.dataset.remove) {
      lockCurrentDays();
      state[t.dataset.remove] = 'skip';
      save();
      replan();
      return;
    }
    if (t.dataset.tab) { tab = t.dataset.tab; render(); return; }
    if (t.dataset.act === 'plan') { locks = {}; save(); replan(); return; }
    if (t.dataset.act === 'import') { openImport(); return; }
    if (t.dataset.act === 'reset') {
      if (!confirm('Reset stars, chosen days and removed places for this trip?')) return;
      try { localStorage.removeItem(storeKey); } catch {}
      location.reload();
      return;
    }
    if (t.dataset.act === 'findstart') { findStart(side.querySelector('#startq').value); return; }
    if (t.dataset.act === 'pickmap') { pickingStart = !pickingStart; render(); return; }
    if (t.dataset.pick !== undefined) {
      const r = startResults[Number(t.dataset.pick)];
      if (!r.none) setStart(r.display_name.split(',')[0], r.lat, r.lon);
      return;
    }
    const row = t.closest('.row');
    if (row && t.dataset.act) {
      const k = row.dataset.key;
      if (t.dataset.act === 'star') state[k] = state[k] === 'must' ? 'want' : 'must';
      if (t.dataset.act === 'skip') state[k] = state[k] === 'skip' ? 'want' : 'skip';
      save();
      render();
      return;
    }
    if (row) {
      const p = TRIP.places.find((x) => x.key === row.dataset.key);
      map.setView([p.lat, p.lng], Math.max(map.getZoom(), 15));
      L.popup().setLatLng([p.lat, p.lng]).setContent(`<b>${label(p)}</b><br>${esc(p.type)}`).openOn(map);
      return;
    }
    if (t.dataset.m !== undefined) {
      const m = markers[Number(t.dataset.m)];
      map.setView(m.getLatLng(), Math.max(map.getZoom(), 15));
      m.openPopup();
    }
  });

  replan();
  if (params.get('new')) openImport(); // a trip just created on the home page starts with its first link
  window.addEventListener('load', () => drawMap(true));
  new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById('map'));
</script>
</body>
</html>
